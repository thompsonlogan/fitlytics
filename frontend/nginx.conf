# Rendered by the nginx image's envsubst entrypoint at container start.
# Only ${BACKEND_UPSTREAM} is substituted (NGINX_ENVSUBST_FILTER=BACKEND_);
# every $nginx variable below is passed through verbatim.

# Rate zones. conf.d files are included at http context, so zone declarations
# are valid here. Keyed by client IP; this container is the TLS-terminated
# edge behind the platform proxy, so $binary_remote_addr is the proxy's view
# of the client — good enough for abuse damping.
# /auth/ endpoints each cost a WorkOS API call — keep them scarce.
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=30r/m;
# /api/ is authenticated traffic; generous ceiling that only trips floods.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Set videos upload straight to R2 via presigned PUT — those bytes never
    # transit this proxy. Only small JSON API bodies pass through here.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 127.0.0.11 is Docker's embedded DNS. Resolving the backend at request time
    # (a variable in proxy_pass forces this) means nginx picks up the backend's
    # new IP after a redeploy instead of caching a stale one from startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─ API + auth → backend, over the internal network only ─────────────────────
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        set $backend "http://${BACKEND_UPSTREAM}";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        limit_req zone=auth_rl burst=15 nodelay;
        set $backend "http://${BACKEND_UPSTREAM}";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 60s;
    }

    # ─ SPA: static assets + client-side routing fallback ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed build assets are immutable — cache hard. Never cache the
    # HTML shell, so a new deploy is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
