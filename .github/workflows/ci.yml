name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR,
# so superseded runs don't pile up. Saves billed minutes on private repos and
# frees runner slots faster on public ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Install swag CLI (needed by `make test` for docs/docs.go)
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Ensure GOBIN is on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed on:"; gofmt -l .; exit 1)
      - name: Generate swagger docs (cmd/api blank-imports the generated docs package)
        run: make swagger
      - name: go vet
        run: go vet ./...
      - name: Test
        run: make test
      - name: Build
        run: make build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # React Doctor's --scope changed diffs against the PR merge base, so it
          # needs full history, not the default shallow (depth 1) checkout.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # React Doctor code-quality scan on PRs. Pinned to 0.8.1: `@latest` moved
      # to 0.8.3, which (a) makes the CI checkout's detached-HEAD fall back to a
      # full-repo scan — `--scope changed` finds no branch to diff — and (b)
      # now exits non-zero on that scan, so it began failing PRs on the existing
      # backlog rather than only newly-introduced issues. 0.8.1 was green on
      # this branch. NOTE: `--scope changed` has in fact always fallen back to a
      # full scan here; making it a true merge-base ratchet needs the base ref
      # wired up, tracked separately.
      - name: React Doctor (block newly-introduced issues)
        if: github.event_name == 'pull_request'
        # Call the CLI directly — `pnpm doctor` resolves to pnpm's built-in
        # doctor command, not the `doctor` npm script.
        run: npx react-doctor@0.8.1 --scope changed
